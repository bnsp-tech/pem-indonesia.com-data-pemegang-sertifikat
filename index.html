<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var _origFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _origFetch;
            },
            set: function(fn) {
              _origFetch = fn;
            }
          });
        } catch (e) {}

        window.addEventListener('error', function(e) {
          if (e.filename && e.filename.indexOf('chrome-extension://') !== -1) {
            e.preventDefault();
          }
        });
      })();
    </script>
    <title>Cek Data Pemegang Sertifikat Kompetensi</title>
    <meta name="description" content="Layanan informasi dan cek data pemegang sertifikat kompetensi sebelum dan setelah 01 November 2022." />
    <meta property="og:title" content="Cek Data Pemegang Sertifikat Kompetensi" />
    <meta property="og:description" content="Layanan informasi dan cek data pemegang sertifikat kompetensi sebelum dan setelah 01 November 2022." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
